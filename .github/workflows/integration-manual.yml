name: Full bridge build (explicit dispatch; source-aware)
on:
  # First deployment to main runs the pinned OAI nonvanishing gate.
  # Every other native stage remains an explicit manual action.
  push:
    branches: [main]
    paths:
      - '.github/workflows/integration-manual.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'oai, zeta, smoke, axioms, full'
        type: choice
        required: true
        default: oai
        options:
          - oai
          - zeta
          - smoke
          - axioms
          - full
permissions:
  contents: read
concurrency:
  group: full-bridge-build
  cancel-in-progress: false
jobs:
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect source pin and prepare workspace before invoking Lake
        run: |
          python3 scripts/verify_lock.py
          python3 scripts/prepare_workspace.py
      - name: Bootstrap Lean toolchain from pinned OAI package
        # The generated bridge manifest does not exist until the first lake update.
        # The pinned OAI checkout contains its original manifest; only install elan here.
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .bridge/vendor/oai/lean
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
      - name: Run selected independent build gate
        run: bash scripts/build.sh '${{ inputs.stage || 'oai' }}'
      - name: Emit provenance even when previous gate fails
        if: always()
        run: python3 scripts/provenance_report.py || true
      - name: Preserve non-secret diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bridge/prepare-evidence.json
            .bridge/provenance-report.json
            .bridge/axiom-audit.log
          if-no-files-found: warn
          retention-days: 30
