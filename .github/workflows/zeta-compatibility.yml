name: M2 Zeta23 Lean 4.34 compatibility diagnostic
on:
  # Launch exactly one M2 diagnostic when this workflow is installed on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/zeta-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Do not compete with the existing long-running OAI proof check.
  group: full-bridge-build
  cancel-in-progress: false
jobs:
  zeta23-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original OAI and Zeta23 commits and compose exact workspace
        run: |
          python3 scripts/verify_lock.py
          python3 scripts/prepare_workspace.py
      - name: Install the shared Lean 4.34.1 toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .bridge/vendor/oai/lean
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
      - name: Resolve the locked OAI dependency graph and retain original patches
        run: timeout --signal=TERM --kill-after=60s 7200 bash scripts/build.sh resolve
      - name: Restore approved Mathlib cache
        run: timeout --signal=TERM --kill-after=60s 1500 bash scripts/build.sh cache
      - name: Compile original Zeta23 Round4 prime discrepancy module in unified workspace
        env:
          BRIDGE_PRE_RESOLVED: '1'
        run: timeout --signal=TERM --kill-after=60s 10200 bash scripts/build.sh zeta
      - name: Produce provenance on both success and failure
        if: always()
        run: python3 scripts/provenance_report.py || true
      - name: Retain source-bound M2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-m2-zeta-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .bridge/prepare-evidence.json
            .bridge/resolution-report.json
            .bridge/provenance-report.json
            .bridge/logs/*.log
            .bridge/gates/*.json
          if-no-files-found: warn
          retention-days: 30
